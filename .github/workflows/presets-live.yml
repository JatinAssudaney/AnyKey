# Runs the live-site tests (`e2e/live/`, `pnpm test:live`) in CI: on a pull request, for each preset it changes; weekly
# and by hand, for all of them, since sites change their pages without notice. Kept apart from CI so a slow or
# changed site holds up only the presets.
name: Presets on live sites

on:
  pull_request:
    paths: ['presets/**', 'e2e/live/**']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# `pull_request` runs a fork's code with a read-only token and no secrets: keep it that way (never
# `pull_request_target`).
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pick the specs
        id: specs
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            # Each changed preset's spec, and each changed spec. A change to live.ts runs them all.
            changed=$(git diff --name-only "origin/$BASE...HEAD" -- presets e2e/live)
            if echo "$changed" | grep -qx 'e2e/live/live.ts'; then
              specs=$(ls e2e/live/*.spec.ts)
            else
              specs=$(echo "$changed" | sed -nE 's#^(presets|e2e/live)/([a-z0-9-]+)\.(json|spec\.ts)$#e2e/live/\2.spec.ts#p' | sort -u | while read -r spec; do if [ -f "$spec" ]; then echo "$spec"; fi; done)
            fi
          else
            specs=$(ls e2e/live/*.spec.ts)
          fi
          echo "Specs: ${specs:-none}"
          echo "list=$(echo $specs)" >> "$GITHUB_OUTPUT"
      - if: steps.specs.outputs.list != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.specs.outputs.list != ''
        run: pnpm build && pnpm exec playwright test -c playwright.live.config.ts ${{ steps.specs.outputs.list }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-test-results
          path: test-results
          retention-days: 7
