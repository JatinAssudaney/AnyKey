<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scroller fixture</title>
    <style>
      /* An app layout: the page never scrolls, a main pane does (like Gmail). */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .app {
        display: flex;
        height: 100%;
      }
      nav {
        width: 200px;
        overflow: auto;
      }
      #pane {
        flex: 1;
        overflow: auto;
      }
      #pane .content {
        height: 4000px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <nav>Sidebar</nav>
      <div id="pane"><div class="content">Main pane</div></div>
    </div>
  </body>
</html>
